; YoMama E22P board variant - DIY
[env:yomama_e22p]
custom_meshtastic_hw_model = PRIVATE_HW
custom_meshtastic_hw_model_slug = YOMAMA_E22P
custom_meshtastic_architecture = nrf52840
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = YoMama E22P
custom_meshtastic_tags = DIY
custom_meshtastic_requires_dfu = true

extends = nrf52840_base
board = promicro-nrf52840

build_flags =
    ${nrf52840_base.build_flags}
    -I variants/nrf52840/diy/yomama_e22p
    -D PRIVATE_HW
    -D YOMAMA_E22P

build_src_filter =
    ${nrf52_base.build_src_filter}
    +<../variants/nrf52840/diy/yomama_e22p>

debug_tool = jlink

[env:yomama_e22p_nogps]
extends = env:yomama_e22p

build_flags =
    ${env:yomama_e22p.build_flags}
    -DMESHTASTIC_EXCLUDE_GPS=1
    -DYOMAMA_E22P_DISABLE_GPS=1

lib_ignore =
    TinyGPSPlus

[env:yomama_e22p_minradio]
extends = env:yomama_e22p_nogps

build_flags =
    ${env:yomama_e22p_nogps.build_flags}
    -DMESHTASTIC_MINIMIZE_BUILD=1
    -DMESHTASTIC_EXCLUDE_I2C=1
    -DMESHTASTIC_EXCLUDE_SCREEN=1
    -DMESHTASTIC_EXCLUDE_BLUETOOTH=1

lib_ignore =
    ${env:yomama_e22p_nogps.lib_ignore}
    ESP8266 and ESP32 OLED driver for SSD1306 displays
    Adafruit SH110X
    Adafruit GFX Library
    Adafruit SSD1306
    Adafruit BMP280 Library
    Adafruit BMP085 Library
    Adafruit BME280 Library
