    Sensirion I2C SFA3x
    Sensirion I2C SCD30
    arduino-sht
    bsec2
    BME68x Sensor library

[env:yomama_e22p_minradio_strict]
extends = env:yomama_e22p_minradio

build_src_filter =
    ${env:yomama_e22p.build_src_filter}
    -<gps/>
    -<graphics/>
    -<input/>
    -<detect/>
    -<motion/>
    -<buzz/>
    +<gps/RTC.cpp>
    +<detect/ScanI2C.cpp>
    +<buzz/buzz.cpp>

lib_deps =
